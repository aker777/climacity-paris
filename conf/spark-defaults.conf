# Configuration Spark par défaut du projet (surchargée au besoin dans les carnets)

# Delta Lake : extensions SQL (MERGE, time travel) et catalogue
spark.sql.extensions                  io.delta.sql.DeltaSparkSessionExtension
spark.sql.catalog.spark_catalog       org.apache.spark.sql.delta.catalog.DeltaCatalog

# Volumes du projet (~10 M lignes) : 200 partitions de shuffle seraient beaucoup trop
spark.sql.shuffle.partitions          8

# Tous les horodatages du projet sont en UTC
spark.sql.session.timeZone            UTC

spark.driver.maxResultSize            1g
spark.ui.showConsoleProgress          false
